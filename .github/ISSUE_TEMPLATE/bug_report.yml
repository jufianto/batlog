name: Bug report
description: Something batlog printed, recorded or did is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Paste the command you ran and its full output (text, not a screenshot, if you can).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: batlog version
      description: Output of `batlog --version`
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      description: Output of `echo "$(sysctl -n hw.model) $(sw_vers -productVersion)"`
      placeholder: Mac16,8 15.7.3
    validations:
      required: true
  - type: textarea
    id: daemon
    attributes:
      label: Recorder status (if it is about recorded data)
      description: Output of `batlog daemon status`, and any errors from `batlog daemon logs`
      render: text
  - type: markdown
    attributes:
      value: |
        Battery captures (`ioreg -rc AppleSmartBattery -a`) contain your battery's serial number. Remove the `Serial` lines before attaching one.
