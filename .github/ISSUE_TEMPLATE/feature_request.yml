name: Feature request
description: A question about your battery that batlog cannot answer yet
labels: [enhancement]
body:
  - type: textarea
    id: question
    attributes:
      label: What do you want to know about your battery or apps?
      description: Describe the question, not the solution. For example, "which app kept my Mac awake overnight?"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you answer it today?
      description: Activity Monitor, another tool, a script, or not at all.
